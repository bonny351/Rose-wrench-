<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard — Rose Wrench</title><link rel="stylesheet" href="css/style.css"><style>
:root{--red:#e10600;--red2:#ff2a22;--black:#070707;--panel:#111;--panel2:#181818;--text:#f5f5f5;--muted:#aaa;--line:#2b2b2b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b0808 0,#070707 42%,#030303 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(225,6,0,.08),transparent 35%,rgba(255,42,34,.04));z-index:-1}
header,.topbar{background:rgba(5,5,5,.96);border-bottom:2px solid var(--red);position:sticky;top:0;z-index:20}
nav{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;letter-spacing:1px;color:#fff}.logo span{color:var(--red)}
nav a{color:#ddd;text-decoration:none;padding:9px 12px;border-radius:8px}nav a:hover{background:#210505;color:#fff}
main,.container{max-width:1200px;margin:auto;padding:28px 18px}
.hero{padding:65px 24px;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,7vw,76px);margin:8px 0;font-weight:950}.hero h1 span{color:var(--red)}
.hero p{color:#bbb;font-size:18px;max-width:700px;margin:14px auto 25px}
.btn,button{background:linear-gradient(180deg,var(--red2),var(--red));border:0;color:#fff;font-weight:800;padding:12px 18px;border-radius:8px;cursor:pointer;box-shadow:0 6px 18px rgba(225,6,0,.2)}
.btn:hover,button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.card,.panel,.section{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #292929;border-radius:14px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.28)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
h1,h2,h3{color:#fff}label{display:block;color:#ddd;font-weight:700;margin:10px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #383838;background:#080808;color:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
table{width:100%;border-collapse:collapse;background:#0b0b0b}th,td{padding:10px;border-bottom:1px solid #292929;text-align:left}th{color:#ff514b}
.notice{padding:12px;border-left:4px solid var(--red);background:#190606;color:#ddd;border-radius:6px}
img{max-width:100%;border-radius:12px}.danger{background:#7d0000}.muted{color:var(--muted)}
@media(max-width:650px){nav{justify-content:center}.hero{padding:42px 15px}main,.container{padding:18px 12px}.grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Rose Wrench Admin</h1><nav><a href="index.html">Booking</a><a href="employee.html">Employee Page</a><button id="logout">Sign Out</button></nav></header><main><section class="card"><h2>Admin Dashboard</h2><p id="who"></p><div class="tabs"><button data-tab="calendar">Calendar</button><button data-tab="jobs">Job Times</button><button data-tab="bays">Bays & Hours</button><button data-tab="employees">Employees</button><button data-tab="settings">Reset</button></div><div id="panel"></div></section></main><script type="module" src="js/admin.js"></script></body></html>
