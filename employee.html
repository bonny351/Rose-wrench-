<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Wrench — Employee Schedule</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1000px;margin:auto;padding:20px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#151515;border:1px solid #303030;border-radius:15px;padding:18px;margin:14px 0}button{border:0;border-radius:9px;padding:11px 14px;background:#e21b23;color:#fff;font-weight:800}.secondary{background:#292929;border:1px solid #444}input,select{width:100%;padding:11px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.appt{display:grid;grid-template-columns:120px 110px 1fr 1fr;gap:10px;padding:12px 0;border-top:1px solid #333}.muted{color:#aaa}.msg{padding:11px;border-radius:8px;margin-top:10px;background:#222}.good{background:#0d2815;color:#9affaa}.bad{background:#350c0c;color:#ffaaaa}.hidden{display:none}@media(max-width:650px){.top,.grid{display:block}.appt{grid-template-columns:1fr}.appt button{width:100%}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Rose Wrench Employee</h1><div id="who" class="muted"></div></div><div><button id="home" class="secondary">Customer Site</button> <button id="logout">Sign Out</button></div></div>
<section id="login" class="card"><h2>Employee Sign In</h2><p class="muted">Use the Firebase email/password account created for you by the shop.</p><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Sign In</button></form><div id="loginMsg"></div></section>
<section id="main" class="hidden"><div class="card"><h2>Shop Schedule</h2><div class="grid"><div><label>Date</label><input id="date" type="date"></div><div><label>Bay</label><select id="bay"><option value="">All bays</option></select></div></div><div id="list"></div></div></section></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";const cfg={apiKey:"AIzaSyCiZuaANb1lrgdn-aARGJ_TRhgzPPUug58",authDomain:"bracelets-and-color.firebaseapp.com",projectId:"bracelets-and-color",storageBucket:"bracelets-and-color.appspot.com",messagingSenderId:"382292570673",appId:"1:382292570673:web:1c966e2e7e8fc2efa31b10"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),fmt=n=>{let h=Math.floor(n/60),m=n%60,a=h>=12?"PM":"AM";h=h%12||12;return`${h}:${String(m).padStart(2,"0")} ${a}`};function today(){let d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};$("date").value=today();async function load(){let st=await getDoc(doc(db,"scheduler","settings"));let data=st.exists()?st.data():{},emails=data.employeeEmails||[];if(!auth.currentUser||!emails.includes((auth.currentUser.email||"").toLowerCase())){$("main").innerHTML='<div class="card"><div class="msg bad">This email is not on the shop employee list. Ask the owner to add it.</div></div>';return}let bays=data.bays||{};$("bay").innerHTML='<option value="">All bays</option>'+Object.entries(bays).filter(([id,b])=>b.active!==false).map(([id,b])=>`<option value="${esc(id)}">${esc(b.name)}</option>`).join("");await render()}async function render(){let date=$("date").value;if(!date)return;let s=await getDocs(query(collection(db,"scheduler","settings","bookings"),where("date","==",date))),a=s.docs.map(d=>d.data()).sort((x,y)=>x.start-y.start),f=$("bay").value;if(f)a=a.filter(x=>x.bayId===f);$("list").innerHTML=a.length?a.map(x=>`<div class="appt"><strong>${fmt(x.start)}–${fmt(x.end)}</strong><strong>${esc(x.bayName||x.bayId)}</strong><span>${esc(x.serviceName)}</span><span>${esc(x.customerName)}<br><small>${esc(x.vehicle||"")} • ${esc(x.phone||"")}</small></span></div>`).join(""):'<div class="msg">No appointments scheduled.</div>}$("date").onchange=render;$("bay").onchange=render;$("form").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(x){$("loginMsg").className="msg bad";$("loginMsg").textContent="Sign-in failed: "+x.message}};$("logout").onclick=async()=>{await signOut(auth);location.reload()};$("home").onclick=()=>location.href="index.html";onAuthStateChanged(auth,async u=>{if(!u){$("logout").classList.add("hidden");return}$("logout").classList.remove("hidden");$("who").textContent=`Signed in as ${u.email}`;$("login").classList.add("hidden");$("main").classList.remove("hidden");try{await load()}catch(e){$("main").innerHTML=`<div class="card"><div class="msg bad">${esc(e.message)}</div></div>`}});</script></body></html>
